name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'TODO.md'
  pull_request:
    paths-ignore:
      - 'TODO.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --if-present
